name: Queued SPI NeoPixel CI

on: [pull_request, push, repository_dispatch]

jobs:
  verify:
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
      with:
        python-version: '3.11'
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 2
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
         repository: crabel99/SimIOFramework
         ref: 13f0abbd25515ae3984571836de1cbf7d2b08f7e
         path: .ci/SimIOFramework
         submodules: recursive

    - name: Install PlatformIO
      run: |
        python -m pip install platformio==6.1.19 clang-format==18.1.8
        sudo apt-get update
        sudo apt-get install --yes doxygen

    - name: Verify native and SAMD builds
      run: python extras/ci/run.py --framework .ci/SimIOFramework

    - name: Check patch formatting
      run: git diff --check HEAD~1
